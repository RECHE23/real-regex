# Python distribution for REAL. Built from the repository root so the sdist
# is self-contained: it carries the C++ headers in include/ alongside the
# binding in bindings/python/. The C++ library itself is header-only and needs none
# of this — see the Makefile and CMakeLists.txt for the C++ workflows.
[build-system]
requires = ["setuptools>=68", "sciforge-build>=2026.6.8"]
build-backend = "setuptools.build_meta"

[project]
name = "real-regex"
version = "2026.7.19"
description = "REAL — linear-time (ReDoS-safe) regex engine with an re-compatible API"
readme = "bindings/python/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "René Chenard" }]
keywords = ["regex", "regular-expression", "redos", "linear-time", "re"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C++",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/RECHE23/real-regex"
Repository = "https://github.com/RECHE23/real-regex"
Documentation = "https://reche23.github.io/real-regex/"
Issues = "https://github.com/RECHE23/real-regex/issues"

# The `real` package lives under bindings/python/; the C++ binding source under
# bindings/python/src; the headers it compiles against under include/ (root).
[tool.setuptools]
package-dir = { "" = "bindings/python" }
packages = ["real"]

[tool.setuptools.package-data]
real = ["*.so", "*.pyd", "py.typed"]

# Build one abi3 wheel per platform (cp310 → works on CPython 3.10+).
[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
test-command = "python -m unittest discover -s {project}/bindings/python/tests"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
