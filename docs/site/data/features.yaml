# The single status source, rendered three ways: the site's {features} directive
# (conf.py), the GENERATED "## Feature scorecard" table in docs/COMPATIBILITY.md
# (tools/gen_features.py, DO-NOT-EDIT markers), and the CI probe
# (tests/frontend/features_probe_generated.inc, same generator).
#
# Schema:
#
#   categories: [ { name: str, scorecard: bool (optional, default true), features: [ FEATURE, ... ] }, ... ]
#
#   CATEGORY.scorecard: false excludes the category from the GENERATED
#     COMPATIBILITY.md table only -- it still renders on the site and its
#     patterns are still probed. "Core" is the one such category: its baseline
#     rows are covered by COMPATIBILITY.md's own "What runs on real" prose.
#
#   FEATURE:
#     construct: str        -- human label; single-backtick spans render as code
#                              (the directive splits on backtick, no full parser)
#     status: enum          -- exactly: supported | extension | excluded-by-design
#                              | planned. Machine slug; the human label is a
#                              display lookup in gen_features.py's STATUS_LABELS
#                              (the one canonical vocab table; conf.py imports it).
#     note: str             -- the rationale cell
#     link: "PAGE#target"   -- OPTIONAL. A live MyST cross-ref target, resolved
#                              BY NAME (a raw #href would 404: make_id folds
#                              div_property to the built id div-property). Never
#                              invented to fill the column.
#     since: str            -- OPTIONAL. Scorecard "Since / target" column;
#                              omitted renders as an em-dash. The site
#                              deliberately does not render it (version history
#                              is CHANGELOG.md's job).
#     pattern: str or null  -- ONE representative regex, consumed by the CI
#                              probe: supported/extension must compile,
#                              excluded-by-design must be rejected, planned and
#                              null are skipped. null only where no single
#                              pattern honestly stands for the claim (see the
#                              one such row's own comment) -- never fabricated.

categories:
  - name: "Core"
    # Off the generated COMPATIBILITY table: its "What runs on real" prose
    # already covers this baseline. Still rendered on the site, still probed.
    scorecard: false
    features:
      - construct: "Literals, concatenation & alternation"
        status: supported
        note: "the base regular-language operators"
        pattern: "abc|xyz"
      - construct: "`.` any character (ECMAScript semantics)"
        status: supported
        note: "excludes `\\n` and `\\r` under the compat/ECMAScript grammar"
        pattern: "a.b"
      - construct: "Character classes & ranges `[a-z]`"
        status: supported
        note: "compiled to the canonical UTF-8-ranges automaton in code-point mode"
        link: "differences-from-re#div_ascii"
        pattern: "[a-z0-9_]+"
      - construct: "`\\d \\w \\s` shorthand classes (+ negations)"
        status: supported
        note: "Unicode-aware in text mode, ASCII under `flags::ascii`/bytes mode"
        link: "differences-from-re#div_icase"
        pattern: "\\d+\\w*\\s?"
      - construct: "Anchors `^ $ \\b \\B`"
        status: supported
        note: "`\\b`/`\\B` on an empty region follow Python 3.11+ by-definition semantics"
        link: "differences-from-re#div_boundary"
        pattern: "^\\bfoo\\b$"
      - construct: "Quantifiers `* + ? {m,n}` (greedy/lazy)"
        status: supported
        note: "compiled to the bounded, linear Thompson/Pike VM"
        pattern: "a+?b*"
      - construct: "Groups (capturing, non-capturing, named)"
        status: supported
        note: "capture is write-only -- there is no backreference to read it"
        pattern: "(?P<x>a)(?:b)"
      - construct: "Lookahead & lookbehind (bounded)"
        status: supported
        note: "REAL's ReDoS-safe bounded lookaround"
        pattern: "(?<=a)b(?=c)"
      - construct: "Possessive quantifiers `a*+ a++ a?+ a{n,m}+`"
        status: supported
        note: "over a single atom, or one wrapped in one capturing group -- linear, ReDoS-safe; `re` 3.11+/PCRE2 parity, RE2/Rust `regex`/Go `regexp` reject the syntax; a compound body is planned"
        link: "differences-from-re#div_possessive"
        pattern: "a++b"
      - construct: "Atomic groups `(?>...)`"
        status: supported
        note: "single atom or one-capture body -- linear; `re` 3.11+/PCRE2 parity, RE2/Rust reject; compound body planned"
        link: "differences-from-re#div_possessive"
        pattern: "(?>ab)c"
      - construct: "ASCII case-insensitive matching (`icase`)"
        status: supported
        note: "byte-for-byte ASCII fold; Unicode-aware folding is a text-mode extension of this"
        pattern: "(?i)ABC"
      - construct: "Multiline mode (`^`/`$` per line)"
        status: supported
        note: "`re`-parity; `$` includes a trailing `\\n` under multiline"
        pattern: "(?m)^a$"

  - name: "Unicode"
    features:
      - construct: "`\\p{…}` property classes"
        status: supported
        # The sc=/scx= short-vs-long-code detail and the unsupported-property
        # examples live only here -- documented nowhere else.
        note: "General_Category + Script + Script_Extensions + the standard binary properties; native, linear `klass_cp`; a REAL superset -- `re` rejects `\\p` outright; `sc=`/`scx=` accept both the long name (`Latin`) and the short UAX24/ISO 15924 code (`Latn`); other UAX44 properties (`Bidi_Class`, `Word_Break`, `Age`, …) stay `unsupported`"
        link: "differences-from-re#div_property"
        since: "2026.7"
        pattern: "\\p{L}+"
      - construct: "`\\N{NAME}` named characters"
        status: supported
        note: "binding resolves the name via `unicodedata` (no C++ table)"
        link: "differences-from-re#div_named_scalar"
        since: "2026.7"
        pattern: null
        # pattern: null -- "supported" here is a Python-binding-level claim: the
        # binding's unicodedata lookup resolves the name before the engine ever sees
        # a code point (COMPATIBILITY.md l.50, "no C++ table"). One pattern cannot
        # honestly represent both surfaces -- it would compile on the Python binding
        # and could fail to compile on the bare C++ parser, which has no name table.
        # A phase-2 probe would need a surface-aware harness to test this row at all;
        # a single fabricated pattern would silently test a narrower claim than the
        # row actually makes.
      - construct: "`\\N{U+XXXX}` scalar form"
        status: extension
        note: "PCRE2-style; uniform C++/Python surfaces -- `re` knows only names"
        link: "differences-from-re#div_named_scalar"
        since: "2026.7"
        pattern: "\\N{U+1F600}"
      - construct: "`\\u{…}` braced hex escape"
        status: extension
        note: "ECMAScript / regex-crate spelling; synonym of `\\x{…}`; `re` rejects the braces"
        link: "differences-from-re#div_u_braced"
        since: "2026.8"
        pattern: "\\u{1F600}"

  - name: "Anchors & lookaround extensions"
    features:
      - construct: "`\\z` end-of-text anchor"
        status: supported
        note: "exact alias of `\\Z` (Python 3.14's meaning)"
        since: "2026.7"
        pattern: "abc\\z"
      - construct: "Variable-width lookbehind `(?<=a|bb)`"
        status: extension
        note: "bounded, so still linear; `re`/PCRE reject it as non-fixed-width"
        link: "differences-from-re#div_lookbehind"
        pattern: "(?<=a|bb)x"
      - construct: "Word-edge anchors `\\< \\>`"
        status: extension
        note: "word-start / word-end; `re` has no such escape"
        link: "differences-from-re#div_icase"
        pattern: "\\<word\\>"

  - name: "Escapes & classes"
    features:
      - construct: "Octal escapes in a class `[\\1]` `[\\12]`"
        status: supported
        note: "every `\\digit` is octal in a class body (no backreferences there)"
        since: "2026.7"
        pattern: "[\\12]"
      - construct: "POSIX `[[:alpha:]]` classes"
        status: supported
        note: "exact `re`-parity: read as a literal class (matches `re`'s FutureWarning-era behaviour), not true POSIX semantics"
        pattern: "[[:alpha:]]+"

  - name: "Flags"
    features:
      - construct: "Global flags `i m s x a` (and `(?imsxa)` prefix)"
        status: supported
        note: "`re` semantics; `re.U` is a no-op, `re.L` excluded"
        pattern: "(?imsxa)a.b"
      - construct: "Scoped inline flags `(?imsxa:…)` / `(?-…:…)` / `(?…-…:…)`"
        status: supported
        note: "per-scope `i m s x a` (Python 3.11 semantics), exact `re`-parity in str and bytes"
        since: "2026.7"
        pattern: "(?i:abc)(?-i:def)"

  - name: "Excluded by design"
    features:
      - construct: "Backreferences `(a)\\1`, `(?P=n)`"
        status: excluded-by-design
        note: "non-regular -> super-linear -> ReDoS"
        link: "differences-from-re#div_rejected"
        pattern: "(a)\\1"
      - construct: "Conditional groups `(?(id)…)`, recursion, callouts"
        status: excluded-by-design
        note: "non-regular control flow -> ReDoS"
        link: "differences-from-re#div_rejected"
        pattern: "(?(1)a|b)"
