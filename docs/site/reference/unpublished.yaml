# Public, not \internal, and intentionally absent from a curated :members: list.
# check_curated_members.py fails if a published member is in neither that list
# nor here. A reason is required: an omission without one is the silent
# allowlist failure this file exists to stop.
#
# Names are Doxygen <name> text (operator[], find_iter_longest, …).
# Bare `:members:` (publish everything) is not unchecked: the class must carry
# `publish_all: <reason>` here. Switching a page back to the nude form without
# that line is the same silent exit this file exists to stop.

real::basic_regex:
  find_iter_longest: experimental leftmost-longest; not the default surface
  search_longest: experimental leftmost-longest; not the default surface
  raw_program: embedder hook for bindings that drive the VM themselves
  has_first_byte_set: embedder prefilter query
  unique_first_byte: embedder prefilter query
  may_start_with: embedder prefilter query
  named_group_count: allocation-free walk of names; named_groups covers the usual case
  named_group_at: pair of named_group_count

real::basic_match_iterator:
  iterator_category: iterator trait
  difference_type: iterator trait
  reference: iterator trait
  pointer: iterator trait

real::regex_set:
  fused_min_eligible: calibrated fused-scan threshold; not part of the which-matched contract
  uses_fused: instrumentation -- whether this instance took the fused path
  eligible_count: instrumentation -- fused subset size

real::dfa:
  publish_all: opt-in lexer automaton; the page is the whole public surface
real::dfa_match:
  publish_all: two public fields -- winning rule and length
real::fixed_string:
  publish_all: NTTP helper; view() and data are the whole type
real::regex_error:
  publish_all: exception surface; kind/what/position are the whole type

real::compat::basic_regex:
