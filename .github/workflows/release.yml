name: Release

# Build the wheels + sdist and publish to PyPI when a version tag is pushed.
# Publishing uses PyPI Trusted Publishing (OIDC) — no API token is stored.
# One-time PyPI setup (Trusted Publisher) is documented in README.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# Each job caps itself with timeout-minutes: without one the ceiling is GitHub's
# 360-minute default, and a step that never returns holds a runner for six hours
# instead of going red. Ceilings are ~4x the observed maximum.
jobs:
  # Build the wheels (cibuildwheel abi3 across 4 OS) + sdist via SciForge's reusable
  # build-only spine (it also guards tag == pyproject version), uploading them as
  # artifacts. Inputs carry REAL's exact cibuildwheel config. Publishing stays below,
  # in this repo, so the OIDC identity matches the PyPI trusted-publisher.
  build:
    uses: RECHE23/sciforge/.github/workflows/build-wheels.yml@v2026.7.2
    with:
      wheel-os: '["ubuntu-latest","ubuntu-24.04-arm","macos-latest","windows-latest"]'
      cibw-archs-macos: "x86_64 arm64"

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only publish on an actual tag push, not manual dry-runs.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.0

  # Publish the real-regex crate to crates.io, after the wheels are live (the crate carries the same CalVer,
  # so it must point at a released version). This is the first automated crate publish — until now it was a
  # manual `cargo publish`. Gated on the tag and the `crates-io` environment (the CRATES_IO_TOKEN secret lives
  # there, mirroring how `pypi` gates the wheel publish). Idempotent: crates.io is immutable, so a re-run of an
  # already-published version must be a no-op, not a red build — a sparse-index check gates the publish.
  publish-crate:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    environment: crates-io
    steps:
      - uses: actions/checkout@v6
      - name: Install the shim's build deps (clang for the cc-build)
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Skip if this version is already on crates.io (idempotent re-run)
        id: exists
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if curl -sf "https://index.crates.io/re/al/real-regex" | grep -q "\"vers\":\"$ver\""; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "real-regex $ver is already on crates.io — skipping (immutable)."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Vendor the engine and publish
        if: steps.exists.outputs.already == 'false'
        run: |
          make rust-vendor
          cd bindings/rust && cargo publish --allow-dirty --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  # Populate the GitHub /releases page for the tag: auto-generated notes plus the
  # built wheels + sdist attached as downloadable assets. Runs after publish, so a
  # Release only appears for a version that actually shipped to PyPI (which stays
  # the source of truth). Applies to future tags; existing tags are not back-filled.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # create the Release for the tag
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # fetch the annotated-tag object so its message can be read below
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The tag's own annotation is the release notes — write it once (git tag -a … -m/-F at release),
      # and it appears verbatim on the Releases page, no `gh release edit` afterwards. A lightweight tag
      # (empty annotation) falls back to GitHub's auto-generated notes.
      - name: Create the GitHub Release (annotated-tag notes + wheel/sdist assets)
        run: |
          notes="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')"
          if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$notes" > "${RUNNER_TEMP}/notes.md"
            gh release create "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md" --verify-tag dist/*
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag dist/*
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # Notify the two package-manager taps (homebrew-sci, vcpkg-sci) that a new version has
  # released, so their bump.yml workflows push the update directly instead of waiting for
  # their next daily cron. Cross-repo dispatch needs a PAT with Contents:write on both tap
  # repos (the local GITHUB_TOKEN in this job cannot write to another repo) — the tap-side
  # push itself uses each tap's own local GITHUB_TOKEN, not this one.
  notify-taps:
    needs: [publish, github-release]
    if: ${{ needs.github-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dispatch upstream-release to taps
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          for tap in homebrew-sci vcpkg-sci; do
            gh api "repos/RECHE23/$tap/dispatches" \
              -f event_type=upstream-release \
              -f "client_payload[version]=$ver"
          done

  # Nudge pkg.go.dev to index the bindings/go tag co-located with this release (the
  # tag itself is created at cut time by `make release`, never here). Best-effort:
  # pkg.go.dev indexes on demand, so a transient proxy failure must not red the release.
  publish-go:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/setup-go@v5
      - name: Nudge pkg.go.dev for the latest bindings/go tag
        run: GOPROXY=https://proxy.golang.org go list -m github.com/RECHE23/real-regex/bindings/go@latest || true
