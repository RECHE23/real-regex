name: Docs

# Build the Doxygen API reference and publish it to GitHub Pages on every push
# to the default branch. Enable Pages once in the repository settings with
# "GitHub Actions" as the source.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; supersede an in-flight run with the latest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: real-regex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.7.0
          path: sciforge
      - name: Install Doxygen, Graphviz, Clang and LLVM coverage tools
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz clang llvm
      - name: Generate the API reference
        run: make -C real-regex doc
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: real-regex/build/doc/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
