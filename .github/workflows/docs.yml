name: Docs

# Build and publish the documentation SITE to GitHub Pages on every push to the
# default branch (doc-site P1b-B go-live): the themed Sphinx/Breathe landing is
# the front door, with the full Doxygen API reference preserved at /api and the
# llvm-cov coverage report at /coverage (same content the old front page linked,
# one level deeper -- pre-swap deep links into the Doxygen pages moved under /api).
# Enable Pages once in the repository settings with "GitHub Actions" as the source.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; supersede an in-flight run with the latest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: real-regex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.7.2
          path: sciforge
      - name: Install Doxygen, Graphviz, Clang and LLVM coverage tools
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz clang llvm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install the pinned docs toolchain (docs-requirements.txt) into a venv
        run: |
          python -m venv .venv-docs
          .venv-docs/bin/pip install --upgrade pip
          .venv-docs/bin/pip install -r real-regex/docs-requirements.txt
      - name: Build the coverage report (kept at /coverage, as make doc did)
        run: make -C real-regex coverage-html
      - name: Build the site (Sphinx landing + Doxygen at /api + coverage)
        # SPHINXBUILD override instead of putting the venv on PATH: the venv's
        # python would otherwise shadow python3 for every other recipe (measured
        # locally -- the setuptools trap).
        run: make -C real-regex docs-site SPHINXBUILD="$PWD/.venv-docs/bin/sphinx-build"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: real-regex/build/site/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # actions/deploy-pages intermittently fails with a transient "try again later" from the Pages
      # deployment API (seen ~4× on release version-bump commits, where the built docs are unchanged).
      # Try once, then retry once on failure — the retry has cleared it every time.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Retry Pages deploy (the transient API flake)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v5
