name: Docs

# Build and publish the documentation SITE to GitHub Pages on every push to the
# default branch: the themed Sphinx/Breathe landing is
# the front door, with the full Doxygen API reference preserved at /api and the
# llvm-cov coverage report at /coverage (same content the old front page linked,
# one level deeper -- pre-swap deep links into the Doxygen pages moved under /api).
# Enable Pages once in the repository settings with "GitHub Actions" as the source.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; supersede an in-flight run with the latest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: real-regex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.7.2
          path: sciforge
      - name: Install Doxygen, Graphviz, Clang and LLVM coverage tools
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz clang llvm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install build deps (setuptools — python-build precedes sphinx, not bundled on 3.12+)
        run: python -m pip install --upgrade pip setuptools
      - name: Install the pinned docs toolchain (docs/requirements.txt) into a venv
        run: |
          python -m venv .venv-docs
          .venv-docs/bin/pip install --upgrade pip
          .venv-docs/bin/pip install -r real-regex/docs/requirements.txt
      - name: Build the coverage report (kept at /coverage, as make doc did)
        run: make -C real-regex coverage-html
      - name: Build the site (Sphinx landing + Doxygen at /api + coverage)
        # SPHINXBUILD override instead of putting the venv on PATH: the venv's
        # python would otherwise shadow python3 for every other recipe (measured
        # locally -- the setuptools trap).
        run: make -C real-regex docs-site SPHINXBUILD="$PWD/.venv-docs/bin/sphinx-build"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: real-regex/build/site/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # TWO distinct failure modes, and only ONE of them is worth retrying.
      #
      # (1) A FAST API failure: the Pages deployment API answers "try again later" before the
      #     deployment is created (seen ~4× on release version-bump commits, where the built docs are
      #     unchanged). Retrying clears it, and always has. This is what the retry was written for.
      #
      # (2) A QUEUE STALL: the deployment IS created, then sits in `deployment_queued` until the
      #     action's own timeout, which then CANCELS it. Retrying cannot help — and makes it worse.
      #     `deploy-pages` keys the deployment on the commit SHA, so a retry recreates the SAME id and
      #     reads back the cancellation the first attempt just wrote: "Deployment cancelled", a
      #     guaranteed second failure under a step name that blames the wrong thing. Both 2026-08-06
      #     failures (fe55b58, ab2b31c) were this, ten minutes queued apiece. The cause is the upstream
      #     Pages queue; there is nothing in this repository to fix, only a longer wait to grant it.
      #
      # GRANTING THE QUEUE LONGER IS NOT AVAILABLE, and that was tried: `timeout: 1200000` is refused
      # by the action itself — "timeout value is greater than the allowed maximum - timeout set to the
      # maximum of 600000 milliseconds". Ten minutes is the ceiling, so a stall that outlasts it cannot
      # be waited out from here at all. What is left is to stop turning one failure into two, and to
      # fail once, clearly, for the right reason.
      #
      # The mode is told apart by ELAPSED TIME, not by an output of the action: `timeout` and
      # `error_count` are inputs it demonstrably has (it prints them), an error-message output is not
      # something this verified, and a condition resting on an output that does not exist would
      # silently be always-true. The threshold sits far below the 600 s ceiling because the two modes
      # are nowhere near each other — a stall burns the whole ten minutes, a fast API refusal returns
      # in seconds.
      - name: Mark the deploy start (for telling a stall from a fast failure)
        id: t0
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true # the default timeout is also the maximum; raising it is refused
      - name: Classify the failure — fast API error, or queue stall?
        id: mode
        if: steps.deployment.outcome == 'failure'
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.t0.outputs.epoch }} ))
          if [ "$elapsed" -ge 120 ]; then
            echo "first attempt failed after ${elapsed}s — a queue stall (the 600 s ceiling), which a retry cannot clear"
            echo "retry=no" >> "$GITHUB_OUTPUT"
          else
            echo "first attempt failed after ${elapsed}s — a fast API failure, which a retry clears"
            echo "retry=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Retry Pages deploy (fast API failures only)
        if: steps.mode.outputs.retry == 'yes'
        id: deployment_retry
        uses: actions/deploy-pages@v5
      # The first attempt is `continue-on-error`, and the retry may now be SKIPPED rather than run, so
      # without this the job would report success on a deployment that never landed. A skipped retry
      # has outcome 'skipped', which is not 'success', so the stall case fails here — loudly, once,
      # and for the right reason.
      - name: Fail unless the site actually deployed
        if: steps.deployment.outcome != 'success' && steps.deployment_retry.outcome != 'success'
        run: |
          echo "::error::Pages deployment did not complete (first attempt:" \
               "${{ steps.deployment.outcome }}, retry: ${{ steps.deployment_retry.outcome }})." \
               "A queue stall is upstream and clears on its own; re-run this workflow."
          exit 1
