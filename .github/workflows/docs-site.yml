name: Docs-site

# docs/site build + gate (Sphinx + Breathe + pydata-sphinx-theme landing).
# Additive only -- no deploy, nothing goes live here; docs.yml (the live Doxygen Pages
# site) stays the deploy path until the P1b go-live swap.
#
# A DEDICATED workflow, deliberately with NO paths filter: ci.yml's trigger has
# paths-ignore ['**.md', 'docs/**'], so a job living there would be skipped on exactly
# the doc-only pushes it exists to gate (caught in the P1 review). This job costs ~2
# minutes -- cheap enough to run on every push -- and full-local-gate's own
# docs-site-gate step skips with a warning when sphinx-build is absent locally, so THIS
# is the net that always fires.
#
# clang/llvm: docs-site-gate also builds coverage-html + the full
# docs-site release output (build/site/html, api/ + coverage/ copied in) before its
# built-HTML link check -- the /coverage link the landing ships has to resolve to a
# REAL file in every run that gates a push, not just in docs.yml's own deploy job.
# Same toolchain docs.yml already installs for the live build (Makefile's coverage-html
# pins a Clang-based LLVM source-coverage toolchain end to end).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

# One gate at a time per ref; supersede an in-flight run with the latest.
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-site:
    runs-on: ubuntu-latest
    steps:
      # Sibling checkout layout, mirroring docs.yml: coverage-html (run by
      # docs-site-gate so the landing's /coverage link resolves to a
      # real file) compiles the test suite, whose TUs include the SciForge test
      # framework from ../sciforge -- a dependency an initial run missed
      # (green locally where the sibling exists, red here without it).
      - uses: actions/checkout@v6
        with:
          path: real-regex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.7.2
          path: sciforge
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install build deps (setuptools — python-build precedes sphinx, not bundled on 3.12+)
        run: python -m pip install --upgrade pip setuptools
      - name: Install Doxygen + Graphviz + Clang/LLVM (Breathe's XML input + coverage-html)
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz clang llvm
      - name: Install the pinned docs toolchain (docs/requirements.txt) into a venv
        run: |
          python -m venv .venv-docs
          .venv-docs/bin/pip install --upgrade pip
          .venv-docs/bin/pip install -r real-regex/docs/requirements.txt
      - name: docs-site-gate (sphinx -W --keep-going + linkcheck)
        # SPHINXBUILD override, not venv-on-PATH: the venv python would shadow
        # python3 for every non-sphinx recipe -- python-build needs the system
        # python's setuptools (the trap docs.yml documents).
        run: make -C real-regex docs-site-gate SPHINXBUILD="$PWD/.venv-docs/bin/sphinx-build"
