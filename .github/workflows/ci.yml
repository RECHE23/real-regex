name: CI

on:
  push:
    branches: ['**']   # all branches, but not release tags (release.yml covers those)
    paths-ignore: ['**.md', 'docs/**']   # doc-only pushes don't need the full matrix
  pull_request:

jobs:
  # Lint (format + MISRA) via SciForge's reusable spine: it pins clang-tidy-18 and
  # runs this repo's own `make format-check` / `make misra` against the shared lint/
  # config. REAL has no dependency siblings; its one MISRA deviation (the SBO union)
  # lives in its Makefile's --checks, so nothing is passed here.
  lint:
    uses: RECHE23/sciforge/.github/workflows/lint-cpp.yml@v2026.6.4
    with:
      deps: '[]'
      sciforge-ref: v2026.6.4
      runner-mode: hosted

  # POSIX + CMake build via SciForge's reusable build spine: the Makefile under
  # g++-14 + clang++ with sanitizers, and the CMake configure/build/test/install +
  # find_package smoke across linux-x64, Windows/MSVC and native ARM. REAL is a leaf
  # (no dependency siblings) and public (hosted; no self-hosted runner).
  build:
    uses: RECHE23/sciforge/.github/workflows/build-cpp.yml@v2026.6.4
    with:
      deps: '[]'
      sciforge-ref: v2026.6.4
      runner-mode: hosted

  # macOS posix leg. REAL is public, so — unlike the private repos, where macOS is
  # the maintainer's local gate and CI deliberately omits it — contributor PRs are
  # covered on macOS here. build-cpp's posix is Linux-only, so this keeps the macOS
  # coverage as a standalone leg (test + sanitizers under Apple clang).
  posix-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: real-regex
      # The test harness (framework.hpp) is fetched from SciForge as a sibling, so
      # the Makefile's default resolution (../sciforge/include) finds it.
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.6.4
          path: sciforge
      - name: Test (runtime + constexpr static_assert)
        run: make -C real-regex test CXX=clang++
      - name: Sanitizers (ASan + UBSan)
        run: make -C real-regex sanitize CXX=clang++

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Robustness fuzzing smoke run (libFuzzer + ASan/UBSan)
        run: make fuzz FUZZ_TIME=60 CXX=clang++

  # Coverage gate: fail the build if line coverage drops below the floor (was advisory).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: real-regex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.6.4
          path: sciforge
      - name: Install clang + llvm
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Coverage gate (line >= floor)
        run: make -C real-regex coverage-check

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install build dependencies
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Build the binding (using root pyproject.toml) and run suites
        run: |
          python -m pip install -e .
          python -m unittest discover -s python/tests
