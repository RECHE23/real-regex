name: CI

on:
  push:
    branches: ['**']   # all branches, but not release tags (release.yml covers those)
    paths-ignore: ['**.md', 'docs/**', '.github/workflows/docs.yml', '.github/workflows/docs-site.yml']   # doc-only pushes don't need the full matrix; the doc workflows/requirements are validated by the Docs/Docs-site runs they themselves trigger (both fire on every push)
  pull_request:

# One active CI run per ref: a new push cancels the previous (fail-fast across pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job below caps itself with timeout-minutes. Without one the ceiling is
# GitHub's 360-minute default, so a step that never returns -- an unreachable
# package mirror is the usual way -- holds a runner for six hours instead of
# going red. Ceilings are ~4x each job's observed maximum, wide enough for
# runner variance and far short of a hang.
#
# `lint`, `build` and `python` cannot carry one: GitHub rejects timeout-minutes
# on a job that calls a reusable workflow with `uses` (only name/uses/with/
# secrets/needs/if/permissions are accepted there). Their ceiling belongs in
# SciForge, beside the jobs it would bound.
jobs:
  # Cheap preflight (seconds–1 min): format, version, layers, pins, Doxygen.
  # If any of these fail, the multi-OS matrix / fuzz / coverage never start.
  # Order matches full-local-gate: fast high-signal checks first (doc included).
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: real-regex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.7.2
          path: sciforge
      # A tool installed for one step does not go on PATH for the others:
      # update-environment: false, pass it explicitly (PYTHON= below).
      # setup-python on PATH made 3.10 the job default and
      # check-features-probe died on `import yaml`.
      - uses: actions/setup-python@v5
        id: pyfloor
        with:
          python-version: '3.10'
          update-environment: false
      - name: Install doxygen + build tools
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz cmake build-essential
      # Same Uncrustify 0.82 pin as lint-cpp (cached — cold build once, then ~instant).
      - name: Cache Uncrustify 0.82.0
        id: uncrustify
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/uncrustify
          key: uncrustify-0.82.0-${{ runner.os }}-preflight
      - name: Build Uncrustify 0.82.0
        if: steps.uncrustify.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/uc.tgz https://github.com/uncrustify/uncrustify/releases/download/uncrustify-0.82.0/uncrustify-0.82.0.tar.gz
          tar -xzf /tmp/uc.tgz -C /tmp
          cmake -S /tmp/uncrustify-uncrustify-0.82.0 -B /tmp/uc-build && cmake --build /tmp/uc-build -j
          mkdir -p "$HOME/.local/bin" && cp /tmp/uc-build/uncrustify "$HOME/.local/bin/"
      # No apt package for actionlint; the pinned release binary lands on the same
      # ~/.local/bin the preflight step below puts on PATH.
      - name: Install actionlint 1.7.12
        run: |
          curl -fsSL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/actionlint.tgz -C "$HOME/.local/bin" actionlint
      - name: preflight (format → workflows → version → layers → pins → capi-abi → doc → doc-style)
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          LINT="$GITHUB_WORKSPACE/sciforge/lint"
          TOOLS="$GITHUB_WORKSPACE/sciforge/tools"
          echo "── format-check"
          make -C real-regex format-check SCIFORGE_LINT="$LINT"
          # Same position as the local gate. Note this job's paths-ignore drops
          # docs.yml / docs-site.yml: a push touching only those two is linted by
          # the local gate, not here.
          echo "── check-workflows (actionlint over .github/workflows)"
          make -C real-regex check-workflows
          echo "── version-check"
          make -C real-regex version-check
          echo "── check-layers"
          make -C real-regex check-layers
          # The x86-64 floor: SSE2 alive, AVX2 off. full-local-gate runs this too but SKIPS on the
          # maintainer's arm64 machine by construction -- `-mno-avx2` is not an arm64 flag and no arm64
          # build can reach the SSE2 branch at all. This runner is where it actually fires, and it is the
          # only thing standing between an `_mm256_*` leaking into the `#elif __SSE2__` arm and a plain
          # x86-64 build. check-no-simd cannot cover it: with every vector ISA off, both configurations
          # compile the same scalar path.
          echo "── check-sse2-floor (x86-64: SSE2 without AVX2)"
          make -C real-regex check-sse2-floor
          # A per-CALL cost is FIXED, so it hides in every throughput measurement this project owns: the
          # regression this guards against charged 6.8 % on a 3-byte subject and moved none of the 26
          # layout rows. The short row that would have caught it cannot be built (no cheap count_matches
          # exists -- it is iterator entry, ~140 ns before any scan), so the shape is counted, not timed.
          echo "── check-percall-copies (count_walk passes the intent, not a mutated 440-byte view)"
          make -C real-regex check-percall-copies
          echo "── python-syntax (bindings/python at the requires-python floor)"
          make -C real-regex python-syntax PYTHON="${{ steps.pyfloor.outputs.python-path }}"
          echo "── check-pins"
          make -C real-regex check-pins SCIFORGE_TOOLS="$TOOLS"
          # Hardening #4: golden GENERATED from bindings/c/real_capi.h must match the header
          # (silent ABI drift + re-vendor no longer goes green). Enum/flag pins are in the test suite.
          echo "── check-capi-abi (C ABI surface golden)"
          make -C real-regex check-capi-abi
          # features_probe_generated.inc AND docs/COMPATIBILITY.md's
          # GENERATED "## Feature scorecard" table -- both GENERATED from
          # docs/site/data/features.yaml, both checked by this one target. Redundant-but-
          # cheap here (docs/site/data/features.yaml and docs/COMPATIBILITY.md live under
          # docs/**, which this workflow's own paths-ignore skips on a docs-only push, so
          # docs-site-gate — no paths filter — is the step that actually always catches drift;
          # this one covers the case where a features.yaml edit ships alongside other, non-ignored
          # files in the same push, and costs nothing next to check-capi-abi above).
          echo "── check-features-probe (features.yaml -> features_probe_generated.inc + COMPATIBILITY.md scorecard golden)"
          make -C real-regex check-features-probe
          echo "── doc-no-coverage (Doxygen WARN_AS_ERROR)"
          make -C real-regex doc-no-coverage
          # Comment-FORM convention plus the three shapes of the orphaned-block defect (two \brief in
          # one block, a block cut mid-sentence, two blocks stacked with no declaration between).
          # Doxygen warns about NONE of them -- it renders one \brief and drops the rest, and a truncated
          # or stacked block is well formed -- so WARN_AS_ERROR above cannot stand in for this. Must come
          # after doc-no-coverage: that step runs the local Doxygen, and this script refuses to give a
          # verdict against an XML older than the headers (a stale one produced a false clean once).
          echo "── check-doc-style (objects /*! */, attributes //!<, no orphaned blocks)"
          make -C real-regex check-doc-style

  # Lint (format + MISRA) via SciForge's reusable spine: it pins clang-tidy-18 and
  # runs this repo's own `make format-check` / `make misra` against the shared lint/
  # config. REAL has no dependency siblings; its one MISRA deviation (the SBO union)
  # lives in its Makefile's --checks, so nothing is passed here.
  lint:
    needs: preflight
    uses: RECHE23/sciforge/.github/workflows/lint-cpp.yml@v2026.7.2
    with:
      deps: '[]'
      sciforge-ref: v2026.7.2
      runner-mode: hosted

  # POSIX + CMake build via SciForge's reusable build spine, fully collapsed: the
  # Makefile under g++-14 + clang++ on Linux AND Apple clang on macOS (test +
  # sanitizers), and the CMake configure/build/test/install + find_package smoke
  # across linux-x64, Windows/MSVC and native ARM. REAL is a leaf (no dependency
  # siblings) and public (hosted; no self-hosted runner). macOS is enabled because
  # REAL is the public repo where contributor PRs warrant macOS coverage (the
  # private repos opt out, matching their pre-cat-B matrices).
  build:
    needs: preflight
    uses: RECHE23/sciforge/.github/workflows/build-cpp.yml@v2026.7.2
    with:
      deps: '[]'
      sciforge-ref: v2026.7.2
      runner-mode: hosted
      enable-macos: true
      enable-windows-msvc: true
      enable-arm: true

  # Win32 narrowing guard. The CMake/MSVC matrix in `build` runs on x64, where size_t is 64-bit, so a
  # 64-bit literal brace-initialised into a size_t (the C2397 class that slipped into v2026.7.13) compiles
  # clean there — that is the gate-hole. Compiling the engine headers 32-bit (`-m32`) makes size_t 32-bit,
  # turning that narrowing back into the hard error it is on Win32. Syntax-only, so it is fast and needs no
  # 32-bit runtime; -Werror promotes the narrowing warning to the failure it must be.
  win32-narrowing:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install 32-bit g++ multilib
        run: sudo apt-get update && sudo apt-get install -y g++-multilib
      - name: Syntax-only the engine headers with a 32-bit size_t
        run: |
          set -euo pipefail
          printf '#include "real/real.hpp"\n#include "real/dfa.hpp"\nint main() {}\n' > win32_tu.cpp
          g++ -std=c++20 -m32 -Werror -Iinclude -fsyntax-only win32_tu.cpp

  fuzz:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Robustness fuzzing smoke run (libFuzzer + ASan/UBSan)
        run: make fuzz FUZZ_TIME=60 CXX=clang++
      # The compat differential fuzzer (real::compat vs std::regex, on libstdc++) is the net that has
      # caught every silent divergence in the compat layer — it must run in CI so regressions cannot
      # slip past. Reproduce a finding locally with: make fuzz-compat FUZZ_TIME=<secs> (seed a crash
      # by placing the reported input under build/fuzz/corpus-compat/).
      - name: Compat differential fuzzing smoke run (real::compat vs std::regex)
        run: make fuzz-compat FUZZ_TIME=60 CXX=clang++
      # The C ABI shim (bindings/c) — the raw-pointer surface every non-C++ binding sits on — fuzzed under
      # ASan/UBSan. It had no direct fuzzing until the FFI-safety audit; this is the net for that surface.
      - name: C ABI shim fuzzing smoke run (real_compile / find_iter / iter_next)
        run: make c-fuzz FUZZ_TIME=60 CXX=clang++
      # ThreadSanitizer proof that concurrent const operations on one shared regex are race-free
      # (std_engine's lazy build under a mutex). Reproduce locally with: make tsan.
      - name: ThreadSanitizer smoke (concurrent std_engine)
        run: make tsan CXX=clang++
      # Core concurrent caches (shared-confirm / immutables call_once / shared_dfa_for slot mutex).
      # Barrier-synced first search on a fresh const regex — not the compat layer. make tsan-core.
      - name: ThreadSanitizer smoke (core shared-confirm / immutables)
        run: make tsan-core CXX=clang++
      # RE2 drop-in differential vs true libre2. Optional locally (skip if no re2);
      # CI installs libre2 so the oracle always runs. Catches GlobalReplace empty-abut and kin.
      # Reproduce: make fuzz-re2  (needs pkg-config re2). Can-fail: REAL_RE2_DIFF_CANFAIL=1.
      - name: Install libre2 (oracle for real::compat::re2 differential)
        run: sudo apt-get update && sudo apt-get install -y libre2-dev pkg-config
      - name: RE2 drop-in differential (real::compat::re2 vs true libre2)
        run: make fuzz-re2 CXX=clang++

  # Public conformance + exhaustive nets, promoted from the local gate now that the corpus/enumerator
  # substrate is pinnable. The rust-regex + Fowler corpora differential against Python re, and the
  # exhaustive real::compat-vs-std routing check (only the documented nullable-loop capture tolerated).
  # Both consume the SciForge substrate, so SciForge is checked out as a sibling at the pinned tag. Also
  # runs the pin-drift lint on this repo's own workflows. The PR tier is ~1 min.
  conformance:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: real-regex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.7.2
          path: sciforge
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install clang + cmake
        run: sudo apt-get update && sudo apt-get install -y clang cmake
      - name: Install build deps (setuptools — not bundled on Python 3.12+)
        run: python -m pip install --upgrade pip setuptools
      - name: Pin-drift lint (SciForge pins consistent)
        run: bash sciforge/tools/check-pins.sh real-regex
      - name: Build the abi3 extension
        run: make -C real-regex python-build
      - name: Stub truth net (real/__init__.pyi ≡ runtime, mypy.stubtest)
        run: python -m pip install mypy==2.3.0 && make -C real-regex python-stubtest
      - name: Public conformance suites (rust-regex + Fowler, vs Python re)
        run: python3 real-regex/tests/corpora/run_conformance.py
      - name: Exhaustive compat routing check (real::compat vs std::regex)
        run: make -C real-regex exhaustive-compat

  # Language bindings (bindings/): the C ABI shim and the real-regex Rust crate. Linux coverage for the
  # cross-platform pieces the local macOS gate builds — the shim's C++-driver link and the crate's cc-build.
  # cargo is preinstalled on the GitHub Ubuntu image. rust-test runs the differential oracle vs the regex crate.
  bindings:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: real-regex
      - name: Install clang + cmake
        run: sudo apt-get update && sudo apt-get install -y clang cmake
      - name: C ABI shim smoke
        run: make -C real-regex c-test
      - name: Rust crate — differential vs the regex crate
        run: make -C real-regex rust-test
      - name: Rust crate — packaging dry-run (builds the vendored crate standalone)
        run: make -C real-regex rust-publish-check

  # The C shim + Rust crate on macOS (ARM) and Windows (MSVC), via cargo directly: build.rs cc-compiles the
  # shim with the platform C++ compiler, so a platform issue in real_capi.h/.cpp or the crate — a __declspec,
  # a calling convention, a C4996-class deprecation — is caught here, not by a user. cargo and the platform
  # toolchain are preinstalled on the GitHub images; no make (the recipes are Unix-shell).
  bindings-cross:
    needs: preflight
    strategy:
      fail-fast: true   # one OS red cancels the other — fix and re-run, don't burn the sibling
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: crate build + differential tests (default)
        run: cargo test --manifest-path bindings/rust/Cargo.toml
      - name: crate build + differential tests (fallback)
        run: cargo test --manifest-path bindings/rust/Cargo.toml --features fallback

  # Go binding (bindings/go, cgo over bindings/c/real_capi.h). v0.1 scope is explicitly
  # linux-x86-64 + macOS-arm64 only (Windows/MSVC and cross-compilation are out of v0 — see the
  # module's own README). check-vendor runs once (linux leg) — a non-mutating
  # diff of include/ against the committed vendor copy; a drift is identical on every OS.
  go:
    needs: preflight
    strategy:
      fail-fast: true   # one OS red cancels the other — fix and re-run, don't burn the sibling
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install g++ (Ubuntu — cgo needs a C++ compiler; macOS runners ship Xcode's clang++)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Vendored C-ABI drift check
        if: matrix.os == 'ubuntu-latest'
        run: make go-check-vendor
      - name: Build + vet + test (race detector on)
        run: make go-test

  # The third differential fuzzer: real-regex vs the regex crate (cargo-fuzz, nightly). A short smoke here;
  # the long run is on the devbox. re/std/rust are now all covered by a differential fuzzer.
  fuzz-rust:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install clang (the shim's cc-build)
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      - name: Differential fuzz smoke (real-regex vs the regex crate)
        run: make rust-fuzz FUZZ_TIME=45  # this job checks out into the CWD (no real-regex/ subdir)

  # Coverage gate: fail the build if line coverage drops below the floor (was advisory).
  coverage:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          path: real-regex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.7.2
          path: sciforge
      - name: Install clang + llvm
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Coverage gate (line >= floor)
        run: make -C real-regex coverage-check

  # System-install smoke: install REAL to a temp prefix (noarch LIBDIR=lib) and consume it the
  # three supported C++ ways (find_package, pkg-config, direct-copy) plus a negative check that
  # the C++20 guard fires under -std=c++17 (the only thing exercising the guard — CI otherwise
  # builds C++20). pkg-config and cmake are installed explicitly (absent from some images);
  # SciForge is a sibling so REAL's top-level configure resolves the test harness (the install
  # itself is harness-free). This job is also the C++ home for `example-check`:
  # it already has both compilers, and install-smoke's own step (e) already
  # proves every examples/cpp/*.cpp against the INSTALLED package (N of M, fails
  # if they differ), so example-check's direct -Iinclude compile+run is the
  # complementary, cheaper leg — same sources, two proofs.
  install-smoke:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: real-regex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.7.2
          path: sciforge
      - name: Install pkg-config + cmake + clang
        run: sudo apt-get update && sudo apt-get install -y pkg-config cmake clang
      - name: Install smoke (g++)
        run: make -C real-regex install-smoke
      - name: Install smoke (clang++)
        run: make -C real-regex install-smoke CXX=clang++
      - name: Example check (g++ — examples/cpp/*.cpp compiled+run directly against include/)
        run: make -C real-regex example-check
      - name: Example check (clang++)
        run: make -C real-regex example-check CXX=clang++

  # Python binding (abi3) build + unittest via SciForge's reusable spine. REAL's
  # binding is a leaf (no dependency siblings); its exact prior coverage is
  # {linux, macOS, Windows} x {3.10, 3.14}, replicated by the platform toggles.
  python:
    needs: preflight
    uses: RECHE23/sciforge/.github/workflows/python-cpp.yml@v2026.7.2
    with:
      python-versions: '["3.10","3.14"]'
      sciforge-ref: v2026.7.2
      # `deps` clones {repo, path} sibling checkouts; a pip package goes in `pre-install`. Passing
      # "regex" here produced `git clone <url> ""` and killed every python leg.
      deps: '[]'
      # `regex` is the Unicode property cross-oracle's other side. Without it, every generator
      # declined on every runner and printed a line nobody read — while the local gate claimed CI
      # covered that skip. test_unicode_oracle_present.py turns its absence here into a red.
      # Installing it does NOT make the oracle run: its property data is a different Unicode than the
      # committed UCD (tools/check_unicode_oracle.py names the code point), so the comparison still
      # declines — visibly, on its own line, instead of silently.
      pre-install: 'regex'
      # The binding moved under bindings/python/; override the reusable workflow's python/tests default.
      test-cmd: 'python -m unittest discover -s bindings/python/tests'
      runner-mode: hosted
      enable-macos: true
      enable-windows: true
