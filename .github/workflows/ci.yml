name: CI

on:
  push:
    branches: ['**']   # all branches, but not release tags (release.yml covers those)
    paths-ignore: ['**.md', 'docs/**']   # doc-only pushes don't need the full matrix
  pull_request:

jobs:
  # Formatting gate: ensure the whole C++ codebase is formatted with Uncrustify.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: real-regex
      # uncrustify.cfg is owned by SciForge; check it out as a sibling so the
      # Makefile's default (../sciforge/lint) finds it.
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.6.1
          path: sciforge
      # The pinned Uncrustify binary never changes, so cache it (keyed by version)
      # and rebuild from source only on a cache miss — saving the ~3-minute build
      # on every subsequent run.
      - name: Cache Uncrustify 0.82.0
        id: uncrustify
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/uncrustify
          key: uncrustify-0.82.0-${{ runner.os }}
      - name: Build Uncrustify 0.82.0
        if: steps.uncrustify.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y cmake build-essential
          curl -L -o uncrustify-src.tar.gz https://github.com/uncrustify/uncrustify/releases/download/uncrustify-0.82.0/uncrustify-0.82.0.tar.gz
          tar -xzf uncrustify-src.tar.gz
          cd uncrustify-uncrustify-0.82.0
          mkdir build && cd build
          cmake .. && cmake --build . -j
          mkdir -p "$HOME/.local/bin" && cp uncrustify "$HOME/.local/bin/"
      - name: Check formatting
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make -C real-regex format-check

  # POSIX developer workflow: the Makefile, both compilers, plus sanitizers.
  posix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++-14
          - os: ubuntu-latest
            cxx: clang++
          - os: macos-latest
            cxx: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: real-regex
      # The test harness (framework.hpp) is fetched from SciForge as a sibling, so
      # the Makefile's default resolution (../sciforge/include) finds it.
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.6.1
          path: sciforge
      - name: Test (runtime + constexpr static_assert)
        run: make -C real-regex test CXX=${{ matrix.cxx }}
      - name: Sanitizers (ASan + UBSan)
        run: make -C real-regex sanitize CXX=${{ matrix.cxx }}

  misra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: real-regex
      # The MISRA profile (lint/clang-tidy-misra) is owned by SciForge; check it out
      # as a sibling so the Makefile's default (../sciforge/lint) finds it.
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.6.1
          path: sciforge
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: MISRA C++:2023-oriented analysis
        run: make -C real-regex misra

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Robustness fuzzing smoke run (libFuzzer + ASan/UBSan)
        run: make fuzz FUZZ_TIME=60 CXX=clang++

  # Coverage gate: fail the build if line coverage drops below the floor (was advisory).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: real-regex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.6.1
          path: sciforge
      - name: Install clang + llvm
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Coverage gate (line >= floor)
        run: make -C real-regex coverage-check

  # Portable build entry: Windows/MSVC and native ARM, through CMake.
  cmake:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # MSVC
          - os: ubuntu-24.04-arm  # native AArch64
          - os: ubuntu-latest     # x86-64 GCC, sanity for the CMake path
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: real-regex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.6.1
          path: sciforge
      # One bash script across all three OSes (bash ships on the Windows runner);
      # --config/-C Release cover the multi-config MSVC generator and no-op on the
      # single-config Linux ones. The final stage proves the installed config
      # package: a standalone project finds REAL purely through find_package.
      - name: Configure, build, test, install and find_package smoke
        shell: bash
        run: |
          set -e
          STAGE="${{ github.workspace }}/_stage"
          cmake -S real-regex -B real-regex/build -DCMAKE_BUILD_TYPE=Release
          cmake --build real-regex/build --config Release
          ctest --test-dir real-regex/build -C Release --output-on-failure
          cmake --install real-regex/build --config Release --prefix "$STAGE"
          cmake -S real-regex/cmake/smoke -B real-regex/build-smoke -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$STAGE"
          cmake --build real-regex/build-smoke --config Release
          ctest --test-dir real-regex/build-smoke -C Release --output-on-failure

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install build dependencies
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Build the binding (using root pyproject.toml) and run suites
        run: |
          python -m pip install -e .
          python -m unittest discover -s python/tests
