[package]
name = "real-regex"
version = "2026.7.32"
edition = "2021"
description = "Linear-time, ReDoS-safe regular expressions with bounded lookarounds — Rust bindings to the REAL C++ engine."
license = "MIT"
repository = "https://github.com/RECHE23/real-regex"
readme = "README.md"
keywords = ["regex", "redos", "linear-time", "lookaround"]
categories = ["text-processing"]
# Package the vendored engine sources so the crate builds standalone on crates.io. Tests (tests/**) are
# deliberately not packaged — they need the `regex` dev-dependency as a differential oracle and are not part
# of the published API; `cargo publish` noting "ignoring test ... not included" is expected, not a warning to
# fix. They run in CI (the bindings / bindings-cross jobs) against the in-tree sources.
include = ["src/**/*.rs", "build.rs", "Cargo.toml", "README.md", "vendor/**"]

[features]
# Delegate a pattern REAL cannot run linearly (\p{...}, a backreference, an unbounded lookaround) to the
# regex crate, per pattern, via RegexBuilder::fallback(true). Off by default: the crate stays strict and
# dependency-light. Enabling it forfeits the linear-time / ReDoS-safe guarantee for the delegated patterns.
fallback = ["dep:regex"]

[dependencies]
regex = { version = "1", optional = true }

[build-dependencies]
cc = "1"

[dev-dependencies]
regex = "1"
criterion = "0.5"

[[bench]]
name = "engines"
harness = false
